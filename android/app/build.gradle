plugins {
    id "com.android.application"
}

android {
    namespace "com.nickeltap.clover"
    compileSdk 35

    signingConfigs {
        debug {
            // Clover accepts APKs signed only with the V1/JAR scheme.
            enableV1Signing true
            enableV2Signing false
            enableV3Signing false
            enableV4Signing false
        }
    }

    defaultConfig {
        applicationId "com.nickeltap.clover"
        minSdk 17
        targetSdk 25
        versionCode 2
        versionName "1.0.1"
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
        sandbox {
            // Non-debuggable release-mode package. scripts/sign-sandbox-apk.ps1
            // applies the dedicated sandbox identity and V1-only signature.
            initWith release
            matchingFallbacks = ["release"]
            versionNameSuffix "-sandbox"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        // Clover requires targetSdk 25 or lower so CloverAccount discovery works.
        disable "ExpiredTargetSdkVersion"
    }
}

dependencies {
    implementation "com.clover.sdk:clover-android-sdk:334"
    testImplementation "junit:junit:4.13.2"
}
